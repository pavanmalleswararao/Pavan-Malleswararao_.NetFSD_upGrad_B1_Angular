<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Manager</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .profile-card{
            border: 2px solid #333;
            padding: 20px;
            width: 300px;
            border-radius: 8px;
            background-color: #f4f4f4;
        }

        button{
            margin-top: 10px;
            padding: 8px 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>Student Profile</h2>

    <div id="profile" class="profile-card"></div>
    <button onclick="updateMarks(85)">Update Marks to 85</button>

    <script>
        let student={
            name:'Rahul',
            rollno:101,
            marks:72
        }

        function updateStudentProfile(studentObj){
            document.getElementById('profile').innerHTML="<p><strong>Name:</strong> "+studentObj.name+"</p>"+"<p><strong>Roll NO:</strong> "+studentObj.rollno+"</p>"+"<p><strong>Marks:</strong> "+studentObj.marks+"</p>";
        }

        function updateMarks(newMarks){
            student.marks=newMarks;
            updateStudentProfile(student);
        }

        updateStudentProfile(student);
    </script>
</body>
</html>

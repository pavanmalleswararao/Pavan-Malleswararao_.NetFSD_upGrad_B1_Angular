<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Notes Saver</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        textarea{
            width: 300px;
            height: 150px;
            font-size: 16px;
            padding: 10px;
        }

        button{
            margin-top: 10px;
            padding: 8px 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>My Daily Notes</h2>
    
    <textarea id="noteBox" placeholder="Write your note here..."></textarea>

    <button onclick="saveNote()">Save</button>
    <button onclick="ClearNote()">Clear</button>
    <script>
        let savedNote=localStorage.getItem('myNote');

        if(savedNote!==null){
            document.getElementById('noteBox').value=savedNote;
        }

        function saveNote(){
            let note=document.getElementById('noteBox').value;
            localStorage.setItem('myNote',note);
            alert("Note saved!");
        }

        function ClearNote(){
            localStorage.removeItem('myNote');
            document.getElementById('noteBox').value="";
            alert('Note cleared!')
        }
    </script>
</body>
</html>

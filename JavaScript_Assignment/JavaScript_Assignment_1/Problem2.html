<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Evaluaator</title>
</head>
<body>
    <script>
        let marks=82;

        if(marks>=75){
            document.write("Grade A");
        }
        else if(marks>=60){
            document.write("Grade B");
        }
        else if(marks>=40){
            document.write("Grade c");
        }
        else{
            document.write("Fail")
        }
    </script>
</body>
</html>
